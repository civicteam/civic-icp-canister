name: CI Build and Test (Local setup)

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        include: 
          - os: ubuntu-latest
            file_suffix: "-linux"
     
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        echo "Setting up on ${{ matrix.os }}"
        mv ic-test-machine-binaries/ic-test-state-machine${{ matrix.file_suffix }} ic-test-state-machine

    - name: Install dfx  
      uses: dfinity/setup-dfx@main

    - name: Confirm successful installation
      run: dfx --version

    - name: Install Rust target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2.7.3

    - name: Cache npm dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install npm dependencies
      run: npm install

    - name: Install additional Cargo tools
      run: cargo install ic-wasm

    - name: Build WASM module
      run: cargo build --target wasm32-unknown-unknown --release

    - name: List contents of target directory
      run: ls -R target

    - name: Verify WASM module exists
      run: |
        if [ -f target/wasm32-unknown-unknown/release/civic_canister_backend.wasm ]; then
          echo "WASM module found."
        else
          echo "WASM module not found."
          exit 1
        fi

    - name: Set WASM path environment variable
      run: echo "CIVIC_CANISTER_BACKEND_WASM_PATH=$(pwd)/target/wasm32-unknown-unknown/release/civic_canister_backend.wasm" >> $GITHUB_ENV

    - name: Build project
      run: sudo apt-get install build-essential libllm-dev clang lld && RUSTFLAGS="-C linker-flavor=ld.lld" cargo build

    - name: Run tests
      run: |
        chmod +x ic-test-state-machine
        cargo test -- --nocapture
